<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7E6D9"/>
      <stop offset="60%" stop-color="#E8EFE8"/>
      <stop offset="100%" stop-color="#FAF6EF"/>
    </linearGradient>
    <linearGradient id="siloMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CED5CE"/>
      <stop offset="30%" stop-color="#F2F5F2"/>
      <stop offset="70%" stop-color="#B2BEB2"/>
      <stop offset="100%" stop-color="#8E9B8E"/>
    </linearGradient>
    <linearGradient id="millBuilding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284A30"/>
      <stop offset="100%" stop-color="#142C1B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#skyGrad)"/>

  <!-- Agricultural Grain Silos -->
  <g>
    <!-- Silo 1 -->
    <path d="M70 120 L130 90 L190 120 Z" fill="#98A798"/>
    <rect x="70" y="120" width="120" height="180" rx="4" fill="url(#siloMetal)"/>
    <line x1="70" y1="160" x2="190" y2="160" stroke="#7A877A" stroke-width="2"/>
    <line x1="70" y1="200" x2="190" y2="200" stroke="#7A877A" stroke-width="2"/>
    <line x1="70" y1="240" x2="190" y2="240" stroke="#7A877A" stroke-width="2"/>

    <!-- Silo 2 (Taller, central) -->
    <path d="M170 90 L240 55 L310 90 Z" fill="#889888"/>
    <rect x="170" y="90" width="140" height="210" rx="4" fill="url(#siloMetal)"/>
    <line x1="170" y1="130" x2="310" y2="130" stroke="#7A877A" stroke-width="2"/>
    <line x1="170" y1="175" x2="310" y2="175" stroke="#7A877A" stroke-width="2"/>
    <line x1="170" y1="220" x2="310" y2="220" stroke="#7A877A" stroke-width="2"/>

    <!-- Silo 3 -->
    <path d="M290 110 L350 80 L410 110 Z" fill="#98A798"/>
    <rect x="290" y="110" width="120" height="190" rx="4" fill="url(#siloMetal)"/>
  </g>

  <!-- Modern Automated Rice Processing Mill Building -->
  <polygon points="360,180 560,150 560,330 360,330" fill="url(#millBuilding)"/>
  <!-- Glass windows panel band -->
  <rect x="380" y="210" width="150" height="24" fill="#CDE2D2" opacity="0.8"/>
  <line x1="410" y1="210" x2="410" y2="234" stroke="#183A20" stroke-width="2"/>
  <line x1="440" y1="210" x2="440" y2="234" stroke="#183A20" stroke-width="2"/>
  <line x1="470" y1="210" x2="470" y2="234" stroke="#183A20" stroke-width="2"/>
  <line x1="500" y1="210" x2="500" y2="234" stroke="#183A20" stroke-width="2"/>

  <!-- High-capacity loading bay -->
  <rect x="400" y="270" width="80" height="60" rx="4" fill="#102C1B"/>
  <rect x="495" y="270" width="50" height="60" rx="4" fill="#102C1B"/>

  <!-- Foreground Ground & Roadway -->
  <rect x="0" y="320" width="600" height="80" fill="#D3C9B8"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#B88A35" stroke-width="4"/>

  <!-- Sun Flare Accent -->
  <circle cx="510" cy="80" r="45" fill="#FFF2CE" opacity="0.6"/>
</svg>

