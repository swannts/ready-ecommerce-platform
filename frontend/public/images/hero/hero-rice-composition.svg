<svg width="800" height="640" viewBox="0 0 800 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background glow & lighting -->
    <radialGradient id="sunGlow" cx="65%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#F5E8C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FAF6EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terraceField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A6B44"/>
      <stop offset="100%" stop-color="#183A20"/>
    </linearGradient>
    <linearGradient id="sackBurlap" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#D9C3A3"/>
      <stop offset="50%" stop-color="#BA9E77"/>
      <stop offset="100%" stop-color="#8F7149"/>
    </linearGradient>
    <linearGradient id="woodBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C532B"/>
      <stop offset="60%" stop-color="#5E3314"/>
      <stop offset="100%" stop-color="#3D1E07"/>
    </linearGradient>
    <radialGradient id="riceGrainsGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8F6F0"/>
      <stop offset="100%" stop-color="#E5DEC9"/>
    </radialGradient>
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D07E"/>
      <stop offset="70%" stop-color="#B88A35"/>
      <stop offset="100%" stop-color="#7B5614"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#183A20" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ambient Golden Sunlight Glow -->
  <circle cx="560" cy="220" r="320" fill="url(#sunGlow)"/>

  <!-- Stylized Rice Field Terraces in Horizon -->
  <path d="M220 320 C 350 240, 520 270, 780 200 L800 480 L220 480 Z" fill="url(#terraceField)" opacity="0.22"/>
  <path d="M260 360 C 420 300, 580 320, 800 270 L800 520 L260 520 Z" fill="url(#terraceField)" opacity="0.32"/>

  <!-- Rice Sacks (Burlap Bags) -->
  <g filter="url(#softShadow)">
    <!-- Back Sack -->
    <path d="M480 220 C490 190, 560 190, 580 220 C600 250, 610 370, 590 410 C570 430, 480 430, 460 410 C440 370, 450 250, 480 220 Z" fill="url(#sackBurlap)"/>
    <!-- Sack Tie Cord -->
    <path d="M485 240 Q530 250 575 240" stroke="#684A28" stroke-width="6" stroke-linecap="round"/>
    <path d="M510 240 Q500 275 490 290" stroke="#7E5C35" stroke-width="4" stroke-linecap="round"/>
    <!-- Sack Label Stamp -->
    <rect x="495" y="290" width="70" height="45" rx="4" fill="#FAF6EF" opacity="0.85"/>
    <text x="530" y="312" font-family="serif" font-size="10" font-weight="bold" fill="#183A20" text-anchor="middle">RICEMART</text>
    <text x="530" y="325" font-family="sans-serif" font-size="8" fill="#B88A35" text-anchor="middle">PREMIUM 50KG</text>

    <!-- Main Front Sack -->
    <path d="M280 280 C300 240, 410 240, 430 280 C455 330, 465 480, 435 520 C405 545, 290 545, 260 520 C235 480, 250 330, 280 280 Z" fill="url(#sackBurlap)"/>
    <path d="M295 305 Q355 320 415 305" stroke="#5A3A1B" stroke-width="8" stroke-linecap="round"/>
    <rect x="305" y="375" width="100" height="60" rx="6" fill="#FFFDF8" opacity="0.9"/>
    <text x="355" y="405" font-family="serif" font-size="14" font-weight="bold" fill="#183A20" text-anchor="middle">BASMATI</text>
    <text x="355" y="422" font-family="sans-serif" font-size="10" font-weight="600" fill="#B88A35" text-anchor="middle">ORGANIC GRAIN</text>
  </g>

  <!-- Wooden Bowl Filled with White Rice -->
  <g filter="url(#softShadow)">
    <!-- Bowl Body -->
    <ellipse cx="520" cy="460" rx="190" ry="90" fill="url(#woodBowl)"/>
    <ellipse cx="520" cy="452" rx="178" ry="80" fill="#4A250B"/>
    
    <!-- White Rice Mound inside bowl -->
    <ellipse cx="520" cy="435" rx="165" ry="70" fill="url(#riceGrainsGlow)"/>
    
    <!-- Detailed rice grains texture -->
    <g fill="#DCD4BE" opacity="0.75">
      <ellipse cx="440" cy="425" rx="9" ry="3.5" transform="rotate(-15 440 425)"/>
      <ellipse cx="475" cy="418" rx="8" ry="3" transform="rotate(25 475 418)"/>
      <ellipse cx="520" cy="410" rx="9" ry="3.2" transform="rotate(-5 520 410)"/>
      <ellipse cx="560" cy="420" rx="8" ry="3" transform="rotate(35 560 420)"/>
      <ellipse cx="600" cy="430" rx="9" ry="3.2" transform="rotate(-20 600 430)"/>
      <ellipse cx="490" cy="435" rx="9" ry="3" transform="rotate(10 490 435)"/>
      <ellipse cx="535" cy="440" rx="8.5" ry="3" transform="rotate(-30 535 440)"/>
      <ellipse cx="420" cy="445" rx="8" ry="3" transform="rotate(40 420 445)"/>
      <ellipse cx="620" cy="450" rx="8.5" ry="3.2" transform="rotate(-10 620 450)"/>
    </g>
  </g>

  <!-- Golden Rice Stalks (Paddy Ears) -->
  <g stroke="url(#goldStem)" stroke-linecap="round">
    <!-- Stalk 1 -->
    <path d="M680 560 Q720 380 650 180" stroke-width="4" fill="none"/>
    <!-- Grains on stalk 1 -->
    <g fill="url(#goldStem)">
      <ellipse cx="652" cy="188" rx="12" ry="5" transform="rotate(-40 652 188)"/>
      <ellipse cx="665" cy="210" rx="13" ry="5.5" transform="rotate(30 665 210)"/>
      <ellipse cx="660" cy="235" rx="14" ry="6" transform="rotate(-35 660 235)"/>
      <ellipse cx="678" cy="260" rx="14" ry="6" transform="rotate(25 678 260)"/>
      <ellipse cx="675" cy="290" rx="14" ry="6" transform="rotate(-30 675 290)"/>
      <ellipse cx="692" cy="320" rx="14" ry="6" transform="rotate(20 692 320)"/>
    </g>

    <!-- Stalk 2 Arching -->
    <path d="M720 580 Q770 360 690 140" stroke-width="3.5" fill="none"/>
    <g fill="url(#goldStem)">
      <ellipse cx="695" cy="148" rx="12" ry="5" transform="rotate(-35 695 148)"/>
      <ellipse cx="710" cy="175" rx="13" ry="5.5" transform="rotate(35 710 175)"/>
      <ellipse cx="712" cy="205" rx="14" ry="6" transform="rotate(-25 712 205)"/>
      <ellipse cx="730" cy="235" rx="14" ry="6" transform="rotate(30 730 235)"/>
      <ellipse cx="732" cy="270" rx="14" ry="6" transform="rotate(-20 732 270)"/>
    </g>
  </g>
</svg>

